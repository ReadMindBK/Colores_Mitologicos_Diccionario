<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>READMIND</title>
  
  <style>
    /* Estilos generales del cuerpo */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef7ff, #ffffff);
      display: flex;
      flex-direction: column; /* Asegura que todo se apile verticalmente */
      align-items: center;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Estilos de la tarjeta principal */
    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.18);
      animation: fade .6s ease;
      box-sizing: border-box;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .cover {
      width: 100%;
      border-radius: 18px;
      display: block;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #2f80ed;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: scale(.96); }

    #progress {
      width: 100%;
      margin-top: 18px;
    }

    #time {
      text-align: center;
      color: #666;
      margin-top: 8px;
    }

    /* Centra el contenedor del botón en la parte inferior */
    .contenedor-enlace-web {
      text-align: center;
      margin-top: 30px; 
      margin-bottom: 10px;
      width: 100%;
    }

    /* Estilos del texto/botón SITIO WEB */
    .enlace-sitio-web {
      text-decoration: none;
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 25px;
      font-style: italic;
      font-weight: 900;
      color: white;
      -webkit-text-stroke: 1.2px #a0a0a0;
      text-shadow: 2px 2px 3px rgba(0,0,0,0.2);
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .enlace-sitio-web:hover {
      transform: scale(1.05);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="cover" src="portada.jpg" alt="Portada">
    
    <div class="controls">
      <button id="play">▶ Escuchar</button>
    </div>
    
    <input id="progress" type="range" min="0" max="100" value="0">
    <div id="time">00:00 / 00:00</div>
    <audio id="audio"><source src="audio.mp3" type="audio/mpeg"></audio>

    <!-- Botón SITIO WEB -->
    <div class="contenedor-enlace-web">
      <!-- Reemplaza el '#' con la URL completa de tu web destino -->
      <a href="#" class="enlace-sitio-web" target="_blank">
        &gt;&gt; SITIO WEB &lt;&lt;
      </a>
    </div>
  </div>

  <script>
    const a = document.getElementById('audio');
    const p = document.getElementById('play');
    const r = document.getElementById('progress');
    const t = document.getElementById('time');

    function f(s) {
      if (!isFinite(s)) return "00:00";
      let m = Math.floor(s / 60), x = Math.floor(s % 60);
      return String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
    }

    p.onclick = () => {
      if (a.paused) {
        a.play();
        p.textContent = '⏸ Pausa';
        p.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 250 });
      } else {
        a.pause();
        p.textContent = '▶ Escuchar';
      }
    };

    a.ontimeupdate = () => {
      r.value = (a.currentTime / (a.duration || 1)) * 100;
      t.textContent = f(a.currentTime) + ' / ' + f(a.duration);
    };

    r.oninput = () => a.currentTime = (r.value / 100) * (a.duration || 0);
    a.onended = () => p.textContent = '▶ Escuchar';
  </script>

</body>
</html>
